<svg width="440" height="230" viewBox="0 0 440 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardbg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="440" height="230" rx="12" fill="url(#cardbg2)" stroke="#00c6ff" stroke-opacity="0.4"/>

  <text x="24" y="38" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="700" fill="#00c6ff">
    Most Used Languages
  </text>
  <line x1="24" y1="50" x2="416" y2="50" stroke="#30363d" stroke-width="1"/>

  <g font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#c9d1d9">
    <!-- Python 50% -->
    <text x="24" y="76">Python</text>
    <text x="416" y="76" text-anchor="end">50%</text>
    <rect x="24" y="82" width="392" height="10" rx="5" fill="#21262d"/>
    <rect x="24" y="82" width="0" height="10" rx="5" fill="#3776AB">
      <animate attributeName="width" from="0" to="196" begin="0.1s" dur="1s" fill="freeze"/>
    </rect>

    <!-- TypeScript 17% -->
    <text x="24" y="112">TypeScript</text>
    <text x="416" y="112" text-anchor="end">17%</text>
    <rect x="24" y="118" width="392" height="10" rx="5" fill="#21262d"/>
    <rect x="24" y="118" width="0" height="10" rx="5" fill="#3178C6">
      <animate attributeName="width" from="0" to="67" begin="0.3s" dur="1s" fill="freeze"/>
    </rect>

    <!-- JavaScript 17% -->
    <text x="24" y="148">JavaScript</text>
    <text x="416" y="148" text-anchor="end">17%</text>
    <rect x="24" y="154" width="392" height="10" rx="5" fill="#21262d"/>
    <rect x="24" y="154" width="0" height="10" rx="5" fill="#F7DF1E">
      <animate attributeName="width" from="0" to="67" begin="0.5s" dur="1s" fill="freeze"/>
    </rect>

    <!-- HTML 16% -->
    <text x="24" y="184">HTML</text>
    <text x="416" y="184" text-anchor="end">16%</text>
    <rect x="24" y="190" width="392" height="10" rx="5" fill="#21262d"/>
    <rect x="24" y="190" width="0" height="10" rx="5" fill="#E34F26">
      <animate attributeName="width" from="0" to="63" begin="0.7s" dur="1s" fill="freeze"/>
    </rect>
  </g>
</svg>
