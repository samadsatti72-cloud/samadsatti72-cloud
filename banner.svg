<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#2c5364"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#7ee8fa"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)"/>

  <!-- soft decorative circuit dots -->
  <g opacity="0.25">
    <circle cx="60" cy="40" r="3" fill="#ffffff"/>
    <circle cx="90" cy="55" r="2" fill="#ffffff"/>
    <circle cx="830" cy="30" r="3" fill="#ffffff"/>
    <circle cx="805" cy="60" r="2" fill="#ffffff"/>
    <circle cx="850" cy="180" r="3" fill="#ffffff"/>
    <circle cx="40" cy="190" r="2" fill="#ffffff"/>
    <line x1="60" y1="40" x2="90" y2="55" stroke="#ffffff" stroke-width="1"/>
    <line x1="830" y1="30" x2="805" y2="60" stroke="#ffffff" stroke-width="1"/>
  </g>

  <text x="450" y="95" font-family="Verdana, Geneva, sans-serif" font-size="40" font-weight="700"
        fill="#ffffff" text-anchor="middle">
    Abdul Samad Satti
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- typing tagline -->
  <g>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" from="0" to="620" begin="0.3s" dur="2.6s" fill="freeze"/>
      </rect>
    </clipPath>
    <text x="450" y="140" font-family="Consolas, 'Courier New', monospace" font-size="20"
          fill="url(#glow)" text-anchor="middle" clip-path="url(#reveal)">
      I speak Python and dream in algorithms.
    </text>
  </g>

  <text x="450" y="175" font-family="Verdana, Geneva, sans-serif" font-size="15" fill="#c9e8f5" text-anchor="middle" opacity="0">
    AI Student · Islamabad, Pakistan · Building the future, one line at a time
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.8s" fill="freeze"/>
  </text>
</svg>
